[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-snapshot"
version = "2.0.0"
description = "Capture, package and verify standalone offline HTML from the command line"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ALKASERAM" }]
keywords = ["offline", "web-archive", "playwright", "single-file", "replay"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = ["lxml>=5,<7"]

[project.urls]
Homepage = "https://github.com/ALKASERAM/offline_web_snapshot"
Repository = "https://github.com/ALKASERAM/offline_web_snapshot.git"
Issues = "https://github.com/ALKASERAM/offline_web_snapshot/issues"
Changelog = "https://github.com/ALKASERAM/offline_web_snapshot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
capture = ["playwright>=1.50,<2"]
visual = ["Pillow>=12,<13"]
cli = ["playwright>=1.50,<2", "Pillow>=12,<13"]
dev = [
  "bandit>=1.9,<2",
  "build>=1.2,<2",
  "pip-audit>=2.10,<3",
  "playwright>=1.50,<2",
  "Pillow>=12,<13",
  "ruff>=0.16,<0.17",
]

[project.scripts]
offline-snapshot = "offline_snapshot.cli:main"

[tool.setuptools.package-data]
offline_snapshot = ["runtime.js", "css_runtime.js", "css_urls.js", "bundle_loader.js", "multipage.js", "browser_state.js", "worker_runtime.js", "rewrite.cjs", "node_tools/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "EXE"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B017"]
